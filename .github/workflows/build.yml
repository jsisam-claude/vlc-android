name: build

on:
  push:
  workflow_dispatch:

jobs:
  win64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset x64-release

      - name: Build
        run: cmake --build --preset x64-release

      - name: Smoke test (run the binary, check probe exit codes)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build\x64-release\minimal-player.exe `
               -ArgumentList '--probe','no-such-file.mkv' -PassThru -Wait
          if ($p.ExitCode -ne 1) { throw "probe missing-file: expected 1, got $($p.ExitCode)" }
          $p = Start-Process -FilePath build\x64-release\minimal-player.exe `
               -ArgumentList '--probe' -PassThru -Wait
          if ($p.ExitCode -ne 2) { throw "probe usage: expected 2, got $($p.ExitCode)" }
          Write-Host "smoke test passed"

      - name: Upload player exe
        uses: actions/upload-artifact@v4
        with:
          name: minimal-player-win64
          path: build/x64-release/minimal-player.exe
