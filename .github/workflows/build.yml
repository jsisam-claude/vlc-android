name: build

on:
  push:
  workflow_dispatch:

jobs:
  win64:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            for (const k of ['ACTIONS_CACHE_URL', 'ACTIONS_RUNTIME_TOKEN',
                             'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_SERVICE_V2']) {
              if (process.env[k]) core.exportVariable(k, process.env[k]);
            }

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset x64-release

      - name: Build
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --build --preset x64-release

      - name: Upload player exe
        uses: actions/upload-artifact@v4
        with:
          name: minimal-player-win64
          path: build/x64-release/minimal-player.exe
