plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
}

android {

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/*.so']
        }
    }

    viewBinding.enabled = true

    dataBinding.enabled = true

    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility "$rootProject.ext.targetJVM"
        targetCompatibility "$rootProject.ext.targetJVM"
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        dev {
            initWith debug
            matchingFallbacks = ['debug']
        }
        vlcBundle {
            initWith release
            matchingFallbacks = ['release']
        }
    }
    namespace = 'org.videolan.television'
    lint {
        // Report-only, like upstream's app module: these modules carry
        // years of upstream findings (translations, legacy layouts) that
        // predate this fork. Reports are still generated for review.
        abortOnError = false
    }

}

dependencies {
    implementation project(':application:vlc-android')
    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    testImplementation "androidx.test:core:$rootProject.ext.testCore"
    androidTestImplementation "androidx.test.ext:junit:$rootProject.ext.junitExtVersion"
    implementation 'com.jaredrummler:colorpicker:1.1.0'
}
