// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.android_plugin_version = '9.3.1'
    ext.kotlin_version = '2.4.10'
    ext.kotlinx_version = '1.11.0'
    repositories {
        flatDir dirs: "gradle/plugins"
        def localMirror = new File(rootDir, "../vlc-mirror/m2")
        if (localMirror.isDirectory()) {
            // self-contained mode: resolve ONLY from the committed mirror
            maven { url = localMirror.toURI() }
        } else {
            google()
            mavenCentral()
            mavenLocal()
        }
   }
    dependencies {
        classpath "com.android.tools.build:gradle:$android_plugin_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.vanniktech:gradle-maven-publish-plugin:0.37.0'
    }
}

plugins {
    id 'com.google.devtools.ksp' version '2.3.11' apply false
}

allprojects {
    repositories {
        def localMirror = new File(rootDir, "../vlc-mirror/m2")
        if (localMirror.isDirectory()) {
            // self-contained mode: resolve ONLY from the committed mirror
            maven { url = localMirror.toURI() }
        } else {
            google()
            mavenCentral()
            mavenLocal()
        }
    }
    tasks.withType(Javadoc) {
        // Ignores errors from mavenAndroidJavadocs task
        // (reference: github.com/novoda/bintray-release/issues/71#issuecomment-164324255)
        options.addStringOption('Xdoclint:none', '-quiet')
        options.addStringOption('encoding', 'UTF-8')
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlin {
            compilerOptions {
                jvmTarget.set("$rootProject.ext.targetJVMKotlin")
                optIn.add("kotlin.RequiresOptIn")
            }
        }
    }
}

ext {
    appId = "org.videolan.vlc"
    versionCode = 3070110
    vlcMajorVersion = project.hasProperty('forceVlc4') && project.getProperty('forceVlc4') ? 4 : 3
    versionName = vlcMajorVersion == 3 ? '3.7.2 Beta 1' : '4.0.0-preview - ' + versionCode
    libvlcVersion = vlcMajorVersion == 3 ? '3.7.5' :'4.0.0-eap29'
    medialibraryVersion = '0.13.22' + (vlcMajorVersion == 3 ? '' : '-vlc4')

    targetJVM = JavaVersion.VERSION_1_8
    targetJVMKotlin = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8

    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
    // Fallback only: compile.sh writes android.ndkFullVersion into
    // local.properties from $ANDROID_NDK. VLC 3 keeps NDK 21 because
    // compile-libvlc.sh gates the 32-bit ABIs on exactly r21 ("$REL" != 21),
    // not because later NDKs cannot target API 17 -- r22/r23 can, they are
    // simply not accepted. 64-bit ABIs are gated to r27-r29, and
    // 29.0.14206865 is the newest of those.
    toolchainNdkVersion = properties.getProperty('android.ndkFullVersion') ?: (vlcMajorVersion == 3 ? '21.4.7075529' : '29.0.14206865')
    tooclchainNdkPath = properties.getProperty('android.ndkPath')
    // Informational only -- settings.gradle's android { } block is what the
    // modules actually use (nothing reads these two ext values).
    targetSdkVersion = 36
    compileSdkVersion = 37
    desugarLib = '2.1.5'
    androidxLegacyVersion = '1.0.0'
    androidxCoreVersion = '1.12.0'
    appCompatVersion = '1.6.1'
    lifecycleVersion = '2.5.1'
    androidxPreferencesVersion = '1.2.1'
    androidxActivityVersion = '1.8.2'
    androidxFragmentVersion = '1.6.2'
    androidxAnnotationVersion = '1.10.0'
    androidxRecyclerviewVersion = '1.3.2'
    androidxLeanbackVersion = '1.0.0'
    androidxMaterialVersion = '1.11.0'
    constraintLayoutVersion = '2.1.4'
    windowVersion = '1.1.0'
    mediaVersion = '1.6.0'
    carVersion = '1.7.0'
    jdbcVersion = '3.53.2.1'
    viewPager2Version = "1.0.0"
    archVersion = '2.2.0'
    roomVersion = '2.6.1'
    pagingVersion = '3.2.1'
    junitVersion = '4.13.2'
    junitExtVersion = '1.3.0'
    mockito = '3.3.3' // matches powermock-api-mockito2 2.0.9
    retrofit = '2.12.0' // last okhttp3-based line; retrofit 3.x needs okhttp 5 (minSdk 21)
    moshi = '1.15.2'
    powerMock = '2.0.9'
    espressoVersion = '3.7.0'
    livedataTest = '1.3.0'
    robolectric = '4.16.1'
    mockk = '1.14.11'
    testRunner = '1.7.0'
    orchestrator = '1.6.1'
    testCore = '1.7.0'
    publishScriptPath = '../../buildsystem/publish.gradle'
//    versionCode scheme is T M NN RR AA
//    T: Target/Flavour (1 for Android, 2 for Chrome?)
//    M: Major version from 0 to 9
//    NN: Minor version from 00 to 99
//    RR: Micro/Revision version from 00 to 99
//    AA: ABI from 0 to 99
//    Starting from 13050420 the last digit represents the ABI and the variant (normal or NoTv)
//    Also, the values are sorted to allow the most pertinent version to be prioritized
//
//    Old values
//    0 is dev
//    1 was ARMv5        (deprecated)
//    2 was ARMv6-nofpu  (deprecated)
//    3 was ARMv6-fpu    (deprecated)
//    4 is ARMv7-A
//    5 is x86
//    6 is MIPS
//    7 is ARMv8
//    8 is x86_64
//    9 is MIPS64
//
//    New values
//    0 is dev
//    1 is ARMv7-A No TV
//    2 is ARMv8 No TV
//    3 is x86 No TV
//    4 is x86_64 No TV
//    5 is ARMv7-A
//    6 is ARMv8
//    7 is x86
//    8 is ARMv7-A
}
