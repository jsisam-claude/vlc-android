pluginManagement {
    repositories {
        // Match the root build: in self-contained mode resolve ONLY from the
        // committed mirror, so this build root never contacts external repos
        // either (compile.sh builds libvlc through it via --project-dir).
        def localMirror = new File(settingsDir, "../../vlc-mirror/m2")
        if (localMirror.isDirectory()) {
            maven { url = localMirror.toURI() }
        } else {
            google()
            mavenCentral()
        }
    }
}

plugins {
    id("com.android.settings") version "9.1.1"
}

android {
    minSdk = 17
    targetSdk = 36
    compileSdk = 36 // Dockers: 3.0=36 / 4.0=36
    buildToolsVersion = '36.0.0'
}
include ':libvlc'
