apply plugin: 'com.android.library'
apply plugin: "com.vanniktech.maven.publish"

def abi = System.getenv('GRADLE_ABI')?.toLowerCase()
def vlcSrcDirs = System.getenv('GRADLE_VLC_SRC_DIRS')
ext {
    library_version = "$rootProject.ext.libvlcVersion"
}

def libvlc_revision = providers.exec {
    commandLine('git', 'rev-parse', '--short', 'HEAD')
}.standardOutput.asText.get().trim()

def vlcSourceDir = "$projectDir/../vlc"
File vlcSourcesFile = file("$vlcSourceDir/NEWS")
def vlc_revision = vlcSourcesFile.exists() ? providers.exec {
    workingDir(vlcSourceDir)
    commandLine('git', 'rev-parse', '--short', 'HEAD')
}.standardOutput.asText.get().trim() : 'unknown'

// A Copy task whose source directory does not exist is NO-SOURCE: Gradle skips
// it and the build still SUCCEEDS. libvlcjni/vlc is a gitignored symlink to
// ../../vlc-libs/vlc, so in a fresh clone it is absent, every lua copy below is
// skipped, and the AAR ships with no assets at all -- a broken artifact from a
// green build. Resolve the sources through this instead, so the failure is loud.
def requireVlcShare = { String relative ->
    File dir = file(relative)
    if (!dir.isDirectory()) {
        throw new GradleException(
            "libvlc: required source directory is missing: ${dir}\n" +
            "  libvlcjni/vlc is a gitignored symlink and is absent in a fresh clone.\n" +
            "  Create it before building:  ln -s ../../vlc-libs/vlc libvlcjni/vlc\n" +
            "  (./tools/vendor-videolan.sh does this, and much else, for you.)\n" +
            "  Without it the AAR would be built with no lua assets and no error.")
    }
    return dir
}

android {

    // Same reason as :application:app -- this module packages the libvlc .so
    // files into its AAR. Guarded because this file is also usable from the
    // standalone libvlcjni build root, which does not define these.
    if (rootProject.ext.has('toolchainNdkVersion')) {
        ndkVersion = rootProject.ext.toolchainNdkVersion
        if (rootProject.ext.tooclchainNdkPath != null)
            ndkPath = rootProject.ext.tooclchainNdkPath
    }

    namespace = 'org.videolan'
    lint {
        // Report-only, like upstream's app module: these modules carry
        // years of upstream findings (translations, legacy layouts) that
        // predate this fork. Reports are still generated for review.
        abortOnError = false
    }

    compileOptions {
        // Without this the module silently takes AGP's default (Java 11) while every other
        // module compiles at 8 — and it is the one module whose javac then uses the
        // per-JDK jlink --system image, tying its output to whatever JDK ran the build.
        // Literal, not rootProject.ext: this module is also built with libvlcjni/ as root.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        resValue "string", "build_libvlc_revision", libvlc_revision
        resValue "string", "build_vlc_revision", vlc_revision
        tasks.whenTaskAdded { task ->
            // The lua Copy tasks write into assets/lua (a declared asset source dir). Every task
            // that consumes the merged assets must run after them or Gradle 9 fails the build with
            // an implicit-dependency error: the asset merge, and also lint's model/analyze tasks.
            // Matched by shape, not by exact name: AGP has lintAnalyze*, lintVitalAnalyze*,
            // generate*LintModel, generate*LintVitalModel and generate*LintReportModel, and the
            // lintVital* family runs in assembleRelease/bundleRelease.
            if (task.name.startsWith('merge')
                    || task.name.startsWith('lint')
                    || (task.name.startsWith('generate') && task.name.contains('Lint'))) {
                task.dependsOn luaPlaylistCopy
                task.dependsOn luaMetaCopy
                task.dependsOn luaModuleCopy
            }

            // jniLibs.srcDirs above is populated by ndk-build (compile-libvlc.sh),
            // not by Gradle. If the native stage has not run, the directory simply
            // does not exist, AGP merges nothing, and the AAR -- and every APK
            // built from it -- ships with ZERO .so files from a completely green
            // build. On device that is unrecoverable rather than degraded:
            // LibVLC.java's loader calls System.exit(1) when the library is
            // missing. Fail at packaging time instead.
            //
            // Opt out with -PallowNoNativeLibs=true to build the Java/Gradle
            // layer alone (dependency verification, lint, unit tests). compile.sh
            // never passes it: it always builds the .so first.
            if (task.name.startsWith('merge') && task.name.endsWith('JniLibFolders')) {
                task.doFirst {
                    if (project.findProperty('allowNoNativeLibs') == 'true') return
                    def dirs = android.sourceSets.main.jniLibs.srcDirs
                    def found = dirs.findAll { it.isDirectory() }
                            .collect { d -> project.fileTree(d).filter { it.name.endsWith('.so') }.files }
                            .flatten()
                    if (found.isEmpty()) {
                        throw new GradleException(
                            "libvlc: no .so files in any jniLibs source directory:\n" +
                            dirs.collect { "    ${it}${it.isDirectory() ? '' : '  (does not exist)'}" }.join('\n') +
                            "\n  The native stage has not run, so this AAR would contain no native\n" +
                            "  libraries and the app would abort on launch.\n" +
                            "  Build them:  ./buildsystem/compile.sh -a <abi>\n" +
                            "  Or, to build only the Java layer on purpose, pass\n" +
                            "  -PallowNoNativeLibs=true.")
                    }
                }
            }
        }

    }

    sourceSets {
        main {
            jniLibs.srcDirs = [ 'jni/libs' ]
            // Unset GRADLE_VLC_SRC_DIRS used to interpolate to a source
            // directory literally named "null".
            if (vlcSrcDirs) jniLibs.srcDirs += vlcSrcDirs
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets' ]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
        dev {
            initWith debug
            matchingFallbacks = ['debug']
        }
    }

    // Make per-variant version code
    libraryVariants.all { variant ->
        //Custom APK name
        variant.outputs.each { output ->
            if (output.outputFileName != null && output.outputFileName.endsWith('.aar')) {
                output.outputFileName = "libvlc-${abi}-${library_version}.aar"
            }
        }
    }

    // hrtfsCopy removed: the spatialaudio module (sole consumer of the HRTF
    // asset) is not built in this fork.

    task luaPlaylistCopy(type: Copy) {
        from { requireVlcShare('../vlc/share/lua/playlist') }
        into 'assets/lua/playlist'
        exclude '**/*.txt'
    }

    task luaModuleCopy(type: Copy) {
        from { requireVlcShare('../vlc/share/lua/modules') }
        into 'assets/lua/modules'
        exclude '**/*.txt'
    }

    task luaMetaCopy(type: Copy) {
        from { requireVlcShare('../vlc/share/lua/meta') }
        into 'assets/lua/meta'
        exclude '**/*.txt'
    }
    buildFeatures {
        buildConfig = true
        resValues = true
    }
}

clean {
    delete 'build', 'jni/libs', 'jni/obj'
}

dependencies {
    api "androidx.annotation:annotation:$rootProject.ext.androidxAnnotationVersion"
    api "androidx.legacy:legacy-support-v4:$rootProject.ext.androidxLegacyVersion"
}

// built inside vlc-android
if (file('../../buildsystem/publish.gradle').exists()) {
    apply from: '../../buildsystem/publish.gradle'
}
