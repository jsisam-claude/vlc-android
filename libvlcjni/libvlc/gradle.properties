GROUP=org.videolan.android
POM_ARTIFACT_ID=libvlc-all

# Module-scoped so they hold whichever build root resolves this project.
# compile.sh and CI now build :libvlcjni:libvlc through the repo root, whose
# gradle.properties would otherwise supply the vlc-android POM_URL/POM_SCM_*
# and silently republish libvlc-all under the wrong coordinates.
POM_URL=https://code.videolan.org/videolan/libvlcjni
POM_SCM_URL=https://code.videolan.org/videolan/libvlcjni
POM_SCM_CONNECTION=scm:git:https://code.videolan.org/videolan/libvlcjni.git
POM_SCM_DEV_CONNECTION=scm:git:https://code.videolan.org/videolan/libvlcjni.git


POM_NAME=LibVLC-Android
POM_DESCRIPTION=Android bindings and API for VLC
POM_INCEPTION_YEAR=2021